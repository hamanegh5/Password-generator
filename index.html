<!DOCTYPE html>
<html>
<head>
    <title>Password Generator</title>
    <link rel="stylesheet" href="indexPSG.css">
</head>
<body>
<div class="container">
    <div class="password-box">
        <input class="password" type="text" aria-label="Generated password" readonly>
        <div class="copy-btn">
            <i class="fa-regular fa-copy" id="copy-btn"></i>
            <span>Copied!</span>
        </div>
    </div>
    <div class="checkboxes-box">
        <div class="uppercase">
            <input type="checkbox" name="" id="uppercase">
            <span>Uppercase</span>
        </div>
        <div class="lowercase">
            <input type="checkbox" name="" id="lowercase" checked>
            <span>Lowercase</span>
        </div>
        <div class="numbers">
            <input type="checkbox" name="" id="numbers">
            <span>Numbers</span>
        </div>
        <div class="symbols">
            <input type="checkbox" name="" id="symbols">
            <span>Symbols</span>
        </div>
    </div>
    <div class="password-length">
        <h3>Password Length</h3>
        <input type="range" min="6" max="32" value="12">
        <div class="length-value">12</div>
    </div>
    <button class="generate-btn">Generate Password</button>
</div>
<script src="indexPSG.js"></script>
</body>
</html>
